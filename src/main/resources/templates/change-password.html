
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>Đổi mật khẩu - Task Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 30px;
        }

        .container {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .error {
            color: #dc2626;
        }
        .back {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 16px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>
<div class="container">

    <h2>Đổi mật khẩu</h2>

    <p class="error"
       th:if="${error}"
       th:text="${error}"></p>

    <form th:action="@{/change-password}" method="post">

        <label>Mật khẩu hiện tại</label>
        <input type="password"
               name="currentPassword"
               autocomplete="current-password"
               required>

        <label>Mật khẩu mới</label>
        <input type="password"
               name="newPassword"
               autocomplete="new-password"
               minlength="8"
               required>

        <label>Xác nhận mật khẩu mới</label>
        <input type="password"
               name="confirmPassword"
               autocomplete="new-password"
               minlength="8"
               required>

        <button type="submit">
            Đổi mật khẩu
        </button>
    </form>

    <p>
        <a class="back" th:href="@{/dashboard}">
            ← Quay lại trang chủ
        </a>
    </p>

</div>
</body>
</html>
