
<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Quản lý người dùng</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px 15px;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000012;
        }

        h1 {
            color: #1e40af;
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin: 25px 0;
        }

        .search-form input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #eff6ff;
            color: #1e40af;
        }

        .role {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            background: #e2e8f0;
            color: #334155;
        }

        .role.admin {
            background: #ede9fe;
            color: #6d28d9;
        }

        .empty {
            text-align: center;
            color: #64748b;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>
<div class="container">

    <h1>👥 Quản lý người dùng</h1>
    <p>Danh sách tài khoản trong hệ thống Task Management.</p>

    <form class="search-form"
          th:action="@{/admin/users}"
          method="get">

        <input type="text"
               name="keyword"
               th:value="${keyword}"
               placeholder="Tìm theo họ tên hoặc email...">

        <button type="submit">Tìm kiếm</button>
    </form>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Họ và tên</th>
                    <th>Email</th>
                    <th>Vai trò</th>
                    <th>Ngày tạo</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.fullName}"></td>
                    <td th:text="${user.email}"></td>
                    <td>
                        <span class="role"
                              th:classappend="${user.role == 'ADMIN'} ? 'admin' : ''"
                              th:text="${user.role}">
                        </span>
                    </td>
                    <td th:text="${user.createdAt != null
                        ? #temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm')
                        : '-'}"></td>
                </tr>

                <tr th:if="${#lists.isEmpty(users)}">
                    <td colspan="5" class="empty">
                        Không tìm thấy người dùng nào.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <a class="back" th:href="@{/admin}">
        ← Quay lại Admin Dashboard
    </a>

</div>
</body>
</html>
